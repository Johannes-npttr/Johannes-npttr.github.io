<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Werwolf Spiel</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://use.typekit.net/ilr6wzf.css">

</head>
<body>
  <div class="background"></div>
  <img src="images/home.png" 
  alt="Neues Spiel" 
  onclick="resetGame()" 
  style="position: fixed; 
         bottom: 20px; 
         right: 20px; 
         width: 60px; 
         height: 60px; 
         cursor: pointer; 
         box-shadow: 0 0 10px rgba(255, 255, 255, 0.5); /* Glow-Effekt */
    transition: box-shadow 0.3s ease; /* Animation für den Glow-Effekt */
    border-radius: 50px; /* Abgerundete Ecken */
    border: 1px solid #ccc; /* Leichter Rahmen */
         z-index: 1000;">

  <!-- SPIELSTART -->
  <div id="setup">
    <img src="images/Werwolf_header.png" style="width: 400px; padding-top: 30px; display: block; margin: 0 auto;" />
    <label style="display: block; margin-top: 20px;">Spieleranzahl: 
      <input type="number" id="playerCount" min="3" max="20" />
    </label><br>
    <button onclick="goToRoleSelection()" style="display: block; margin: 0 auto;">Spiel starten</button>
  </div>

  <!-- ROLLEN AUSWAHL -->
  <div id="roleSetup" class="hidden">
    <h2>Rollen auswählen</h2>
    <label>Werwölfe: <input type="number" id="wolvesCount" min="1" /></label><br>
    <label>Seher: <input type="checkbox" id="seerEnabled" /></label><br>
    <label>Hexe: <input type="checkbox" id="witchEnabled" /></label><br>
    <label>Amor: <input type="checkbox" id="armorEnabled" /></label><br>    
    <label>Blinzelmädchen: <input type="checkbox" id="beholderEnabled" /></label><br>
    <label>Heiler: <input type="checkbox" id="healerEnabled" /></label><br>
    <label>Priester: <input type="checkbox" id="priestEnabled" /></label><br>
    <label>Leibwächter: <input type="checkbox" id="bodyguardEnabled" /></label><br>
    <label>Dorfmatratze: <input type="checkbox" id="villageMattressEnabled" /></label><br>
    <label>Jäger: <input type="checkbox" id="hunterEnabled" /></label><br>
    <label>Wildes Kind: <input type="checkbox" id="wildChildEnabled" /></label><br>    <button onclick="assignRoles()">Rollen zuteilen</button>
  </div>

<!-- ROLLENANZEIGE FÜR SPIELER -->
<div id="roleReveal" class="hidden">
  <h2><span id="currentPlayerNumber"></span>, <br>bitte übernehmen</h2>
  <button onclick="showRole()">Rolle anzeigen</button>

  <div id="roleText" class="hidden">
    <p>Deine Rolle:</p>
    
    <!-- Karten-Flip-Container -->
    <div id="card" class="card-container hidden">
      <div class="card">
        <div class="card-face front">
          <img id="roleFrontImage" src="" alt="Vorderseite">
        </div>
        <div class="card-face back">
          <img id="roleBackImage" src="" alt="Rückseite">
        </div>
      </div>
    </div>
  </div>

  <button id="nextPlayerButton" class="hidden" onclick="nextPlayer()">Nächster Spieler</button>
</div>


  <!-- ERZÄHLERMODUS -->
  <div id="narratorMode" class="hidden">
    <h2>Erzähler-Modus</h2>
    <p>Klicke auf einen Namen, um die Rolle zu sehen:</p>
    <div id="playerList"></div>
  </div>

  <!-- NACHTPHASEN -->
  <div id="nightPhase" class="hidden">
    <h2>Nachtphase</h2>
    <p id="nightText">Startet...</p>
    <button onclick="nextNightPhase()">Weiter</button>
  </div>

  <script src="game.js"></script>
</body>
</html>
